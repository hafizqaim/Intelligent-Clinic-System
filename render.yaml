databases:
  - name: intelligent-clinic-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: intelligent-clinic-system-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: intelligent-clinic-db
          property: connectionString
      - key: POSTGRES_USER
        fromDatabase:
          name: intelligent-clinic-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: intelligent-clinic-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: intelligent-clinic-db
          property: database
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
